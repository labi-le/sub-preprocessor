# Seed channels for the Telegram subscription crawler (tg-sub-crawler).
#
# The crawler scans these channels, keeps any live subscription links it finds,
# and follows reposts/@mentions to thematically related channels (bounded by
# CRAWL_DEPTH / CRAWL_MAX_CHANNELS). Channels that yield a live subscription are
# remembered in .crawler-state.json and become seeds automatically — the memory
# keeps the most recently productive ones, so a few good starting points suffice.
#
# This file is re-read every crawl cycle: add a channel and it is picked up on
# the next cycle, no restart needed. Entries may be a bare slug, an @handle, or
# a full t.me URL, and any of those may carry a trailing "/<topic>" to name a
# forum topic inside a group (e.g. mifa_world/1310). A group has no t.me/s
# preview at all. Discovered groups now settle empirically, like seeded ones: a bare discovered group with an empty listing and no topic is a counted dead end, and a discovered <slug>/<digits> hint settles through the same /s/-answer logic a seed's does.
#
# A topic line is not a page budget. A topic is always ONE embed window — the
# discussion widget carries no ?before= cursor — so what a configured line buys
# a group is a depth-0 read immune to the productive memory's 30-day TTL, its
# 200-entry LRU and a lost state file, and for a topic no other window links, the
# read itself. Several topics of one slug are separate seeds: buildSeeds keys by
# the full "<slug>/<topic>" ref, and a bare slug entry beside them is absorbed
# into them rather than probing the group's empty listing.
#
# The eight topic lines added 2026-09-05 name 195 refs between their windows,
# an estimated 140-160 discovered-visit admissions per cycle against the shared
# 200-slot pool (defaultMaxDiscovered, discover.go:39) once self-refs,
# already-seeded slugs and cross-window duplicates come out. Seeds are depth-0
# and exempt, so nothing configured stops being read, but a saturated pool drops
# a nondeterministic tail of EVERY seed's discoveries: watch the cycle's topic
# counters and wall time, and delete FreeClubLife/26 first (frontier only, 0
# novel endpoints) if it bites.
