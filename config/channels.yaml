# Seed channels for the Telegram subscription crawler (tg-sub-crawler).
#
# The crawler scans these channels, keeps any live subscription links it finds,
# and follows reposts/@mentions to thematically related channels (bounded by
# CRAWL_DEPTH / CRAWL_MAX_CHANNELS). Channels that yield a live subscription are
# remembered in .crawler-state.json and become seeds automatically — the memory
# keeps the most recently productive ones, so a few good starting points suffice.
#
# This file is re-read every crawl cycle: add a channel and it is picked up on
# the next cycle, no restart needed. Entries may be a bare slug, an @handle, or
# a full t.me URL, and any of those may carry a trailing "/<topic>" to name a
# forum topic inside a group (e.g. mifa_world/1310). A group has no t.me/s
# preview at all, so without the topic the seed is unreadable, not merely empty.
channels:
  - o00000000i
  - hiddifycode
  - V2RayTunSub
  - YoutubeUnBlockRu
  - immalware
  - whitelistbypass
  - surfboardv2ray   # research find: Type-A https sub (sub.suffusion.workers.dev), 134 nodes verified
  - DailyV2RY   # research find: daily rotating bin.mudfish.net pastes, 42% novelty measured; isolated in the repost graph so BFS cannot reach it
  - Holost_VPN   # measured 2026-08-12: one cycle yielded 22 of the 23 managed sources added that day
  - FreeCFGHub   # measured 2026-08-12: 1 live sub of its own, plus 12 inline nodes on page 1; it is the CHANNEL behind chat FreeCFGHubMIX, whose /s/ 302s (chats have no web preview)
  - mifa_world/1310   # measured 2026-08-14: forum topic, publishes a NEW 24h link daily; its /s/ preview carries zero messages, and 19 of the 20 links on the topic are the panel's own "больше неактуальны" list
  - razlo4ka7/39   # measured 2026-08-14: the group's only subscription topic of 9; 296 inline endpoints and 13 candidates at comments_limit=200, 68 endpoints new against the 159 configured sources, and absent from every other seed's depth-1 frontier so BFS cannot reach it

# Subscription URLs the crawler must never manage. Hand-deleting one of its own
# entries from private.yaml does not stick: the next cycle rediscovers the URL
# in a channel, or a recheck finds it still live, and re-adds it. The field
# decides whose entry it is -- one carrying "managed: true" is the crawler's and
# comes back, one without it is yours and is never rewritten or pruned. Listing
# the URL here is the only way to retire a managed entry for good. Matched
# verbatim against the harvested URL; re-read every cycle like the channels above.
# Two shapes end up here. A duplicate of a curated source (the crawler mirror
# of a URL sources.yaml already carries), and a panel endpoint whose body is a
# single placeholder node: an all-zero credential on the unspecified address,
# whose NAME carries the error text ("Подписка умерла.", "Превышен трафик").
# That second shape no longer NEEDS listing. Since the placeholder guard, such
# a body counts zero nodes and reads nodeless-2xx, so classify never calls it
# live and the crawler never re-adds it. The entries stay because a nodeless
# verdict only DELAYS pruning -- a managed source that stays not-live for the
# retirement window is dropped -- and because the list is the record of which
# panels were checked and rejected, which no pruned entry preserves.
#
# Checking one of these by hand MUST use the service User-Agent:
# is.wepogp.gay serves the real payload to mihomo-geofeed-preprocessor/0.1 and
# a 116-byte stub to a browser UA, so a browser check condemns live sources.
