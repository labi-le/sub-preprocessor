log:
  level: info # debug is verbose (per-node/DNS/probe); it is hot-reloadable, so turn it on live only when troubleshooting
server:
  listen: :8080
  metrics_listen: :9090 # internal Prometheus metrics endpoint; keep loopback-only (published via docker-compose)
geo:
  # Shared geo providers used by the country/asn filters and by annotation.
  # Optional blocks `dbip:` (url, refresh_interval; default: DB-IP Country
  # Lite monthly CSV, 24h) and `registry:` (urls, refresh_interval; default:
  # the 5 RIR delegated-extended files, 24h) configure the downloadable
  # in-memory databases used by the matching annotate providers; the defaults
  # suffice, so they are omitted here. Their refresh_interval reads 0 (and
  # unset) as the 24h default -- NOT as "never", unlike geofeed's below: both
  # are month-stamped mirrors that go stale on their own, so refresh rarely
  # with a long interval (e.g. 720h) instead of disabling.
  # `cloudflare:` (timeout, concurrency; default 15s, 8) configures the
  # cdn-cgi/trace probe behind the `cloudflare` annotate provider -- also
  # omitted here, and it has no endpoint key by design (see annotate below).
  geofeed:
    refresh_interval: 24h # unset => 24h; an explicit 0 loads once at startup and never refreshes
    sources:
      - url: https://github.com/ipanalytics/GeoFeed-Harvester/releases/latest/download/geofeed.csv.gz
        type: gzip
      - url: https://raw.githubusercontent.com/Simonadascalu/Freedomtech-Geofeed/refs/heads/main/Freedomtech%20solutions%20-%20ALL
        type: raw
  asn:
    timeout: 5s
    cache_ttl: 24h # in-memory cache of Cymru ASN lookups; geolocations rarely change (0 = default 24h)
resolver:
  timeout: 5s
  cache_ttl: 1h
  cache_negative_ttl: 10m
# Unified, ordered filter list. IP-stage filters (country/asn) run per-node in
# preprocess; through-node filters (gemini/claude/chatgpt/tidal/bandwidth) run
# post-probe in the stable worker. Order is honoured within each stage.
filters:
  - type: country
    provider: geofeed
    # exclude_groups: [geo_blocked]  # TEMP: left empty so inline (mostly RU/IR/CN) nodes pass the geo filter; empty => no country drop. NOTE: this key only ever affects /stable.txt -- on / the countries come from the query params
  # - type: gemini
  #   DISABLED 2026-08-08. The gate stopped verifying most of what it was handed: over two
  #   consecutive cycles on the production host the WARN reported 227 unverified of 498,
  #   then 269 of 535 (46%, 50%), with geoblock.gemini.key_file readable throughout. Read
  #   those as the WARN prints them -- unverified CLASSIFICATIONS over the PROXY count the
  #   fan-out was handed (`of=`), which is neither a node share nor the gate's own closed
  #   ratio: the check fans out over PROXIES and only one that ANSWERED reaches the
  #   classifier, so a mierus:// node contributes one per answering port. The closed ratio
  #   is stable_gemini_gate_unverified_checks / stable_gemini_gate_checks. (Only the
  #   earlier pair is on record in this repo -- 22 of 306 then 7 of 285 on 2026-08-07,
  #   2f7d63c and AGENTS.md -- and it went 7% then 2.5%, so it is NOT the head of this
  #   trend and is not counted in it.)
  #
  #   Unverified responses were KEPT, not published: claude, chatgpt, tidal and bandwidth
  #   all run after this gate, so a node it could not verify still had four gates to pass.
  #   What it cost was the reading: stable_filter_dropped_nodes{filter="gemini"} kept
  #   showing blocks, so the drops panel read as healthy while half the verdicts were
  #   never obtained. The key file stayed readable -- a missing credential would have
  #   skipped the filter outright (nodefilter.go: "filter configured but disabled;
  #   skipping") -- so this is the API rejecting the request before it looks at the egress
  #   country: quota or a restricted key, not an absent one.
  #
  #   WHAT THE DASHBOARD SHOWS WHILE THIS LINE IS COMMENTED OUT. All three
  #   stable_gemini_gate_* series are ABSENT rather than reading 0. The three states are:
  #   nothing rendered = no gemini gate ran; enabled 0 = configured but no usable key, so
  #   it checked NOTHING and every survivor passed through unverified; enabled 1 = it ran.
  #   Panel 16 ("Gemini gate state") goes red IMMEDIATELY. Its target sets instant: true, so
  #   the query returns an empty vector the moment the series stops being exported, whatever
  #   the dashboard time range still holds; the frame is empty, the special-null mapping and
  #   noValue both read NOT RUNNING, and the base threshold step paints it red -- until this
  #   entry is uncommented. (Until 2026-08-08 the target set neither instant nor range, which
  #   Grafana runs as a RANGE query, reduced with lastNotNull: while the window still held a
  #   pre-disable sample the panel rendered the last exported 1 -- VERIFYING, in GREEN, for a
  #   gate that is off -- for roughly the first day on the default now-24h. That lag is gone.)
  #   Panel 17 ("Gemini gate: unverified share") is instant for the same reason and its base
  #   threshold step is red too, so it reads NO CLASSIFIED RESPONSES on red beside panel 16
  #   rather than sitting green next to its NOT RUNNING: Grafana paints a no-value display
  #   from the BASE step, so a green base would have made "no gate" green. (Until 2026-08-08
  #   that base was green and the noValue read "gate classified nothing".) Panel 18's legend
  #   reduces with last rather than lastNotNull, so its rows go empty instead of freezing at
  #   the final pre-disable counts.
  #   While panel 16 is red it still cannot tell this deliberate disable from
  #   filterAndMeasureEgress bailing on a ParseProxies failure and publishing every survivor
  #   UNFILTERED.
  #
  #   Re-enabling: those series exist only while this entry is live, so there is no cycle
  #   to watch first. Confirm the credential out of band -- a keyed GET to
  #   generativelanguage.googleapis.com must reach the location verdict (400
  #   FAILED_PRECONDITION from a blocked egress, 200 from an accepted one), not 401/403/
  #   404/429 -- then uncomment and watch stable_gemini_gate_unverified_checks against
  #   stable_gemini_gate_checks for a cycle.
  #
  #   Why it needs a credential at all: the location verdict is visible ONLY to a valid one
  #   (geoblock.gemini.key_file/key_var). Keyless the API answers 403 "unregistered
  #   callers", a junk key 400 API_KEY_INVALID, both decided BEFORE it looks at the egress
  #   country. Such an answer is not silently read as "not blocked": the node is still
  #   KEPT, but geminiInconclusive classifies the response (401/403/404/429, or a 400
  #   carrying API_KEY_INVALID) and the check warns and counts it -- one count per
  #   answering proxy, not per node.
  - type: claude
  - type: chatgpt # keyless: OpenAI's compliance endpoint 403s an egress it refuses, regardless of the node's IP country
  - type: tidal # keyless reachability, status only: keep a node if api.tidal.com/v1/country answered 2xx. A refused egress (e.g. RU) dies at CloudFront with a 403, so there is no refusal marker to match. The body is not read at all -- the country it reports gates where a subscription can be bought, not where an existing one plays
  - type: bandwidth # drop nodes slower than min_mbps (last GATE: runs on the fewest nodes)
    test_url: "https://speed.cloudflare.com/__down?bytes=2000000" # Cloudflare speed generator; egresses through the node
    min_mbps: 5 # drop nodes below this; 0 = no floor (annotate only). Raise test_url ?bytes= for higher thresholds
    timeout: 20s # per-node download deadline
    concurrency: 4 # parallel downloads; higher shares the host uplink and can under-report fast nodes
# Ordered annotation tags added to node names (both / and /stable.txt). GEO is
# the only tag the loader accepts; entries still render in order and may
# repeat, so a second `- tag: GEO` with a different chain publishes a second
# tag. Repetition reaches the country FILTER too: it walks every GEO entry's
# chain concatenated in written order, de-duplicated by first occurrence
# (preprocess countryChainOrder), so splitting one chain across entries changes
# only the rendering, never which nodes survive.
annotate:
  - tag: GEO # [GEO:xx], [GEO:??] when every provider misses
    # Ordered chain, first hit wins. cloudflare is Cloudflare's own geo-IP
    # database, asked through cdn-cgi/trace from the node itself; it answers
    # only in the stable worker, which has a post-probe stage to ask from -- on
    # / it always misses and the chain falls through to geofeed. It is no gate
    # and drops nobody. First because it is the only one asked about the EXIT
    # address: the others place the address the RESOLVER returned, and 41% of
    # named hosts sit in Cloudflare anycast ranges that terminate in many
    # countries at once, so a node tagged CA was exiting in Germany (~46% of
    # the list was mistagged). Its timeout/concurrency are geo.cloudflare.*;
    # the endpoint is not configurable, because only Cloudflare's own body
    # parses (stable.cloudflareTraceURL).
    # dbip/registry are downloaded in-memory databases (built only because they
    # are referenced here).
    #
    # `asn` is NOT in this chain, and putting it back needs a new argument.
    # It is Cymru's DNS redistribution of the same RIR delegation data
    # `registry` already holds in RAM, so it is a registry lookup over the
    # network rather than a geolocation source: measured over every address
    # behind every configured subscription it was a strict SUBSET of a complete
    # `registry` -- zero countries it placed that registry did not, zero
    # disagreements where both answered -- and its marginal contribution BEHIND
    # this chain was zero hits, because dbip alone answers all but a handful and
    # the handful are unroutable: RFC 2544 / RFC 5737 space (198.18.0.0/15,
    # 192.0.2.0/24) handed back by DNS-poisoning sinkholes, plus sources that
    # publish 127.0.0.1 or 255.255.255.255 outright, all of which Cymru
    # NXDOMAINs. It stays accepted here (and `{type: country, provider: asn}`
    # and `{type: asn}` stay live) because only Cymru carries the AS NAME the
    # deny patterns match; it just buys no coverage. Re-measure before re-adding.
    providers: [cloudflare, geofeed, dbip, registry]
  # GEO is the last tag standing. The IP and ASN tags were both removed
  # outright, because nothing consumed them and no config selected them, so
  # `- tag: IP` and `- tag: ASN` are now load errors (unknown tag). IP had also
  # stopped being the thing its name promised -- since the trace it carried the
  # MEASURED egress, for a CDN-fronted node precisely the origin the fronting
  # hid (108 of 149 traced nodes last cycle published an address different from
  # the resolved one), and /stable.txt is shared. Note what did NOT go: `asn`
  # is still an ACCEPTED provider name here (this chain just does not list it,
  # see above) and the `{type: asn}` FILTER is live. An
  # upstream-authored [IP:...] or [ASN:...] is still STRIPPED off node names
  # (rewrite.isKnownTag keeps recognising both) on any config that annotates at
  # all. Emptying this list is the exception, not a milder setting: the
  # annotator goes nil, nothing strips anything, and on / the node line is
  # published verbatim (preprocess.bufferSink.emit writes node.Raw), so every
  # upstream tag -- addresses included -- rides along into what we publish.
  # /stable.txt is spared, but only incidentally and not by this setting:
  # stable.Merge relabels every kept node to <source>-NNN before publication,
  # so the Entry.Raw that BuildPayload's nil-annotator arm emits carries no
  # upstream name at all.
geoblock:
  db_path: /config/.geoblock.db
  ttl: 720h
  gemini:
    model: gemini-2.0-flash
    key_file: /run/agenix/litellm-env
    key_var: LITELLM_GOOGLE_API_KEY
    timeout: 15s
    concurrency: 8
  claude:
    timeout: 15s
    concurrency: 8
  chatgpt:
    timeout: 15s
    concurrency: 8
  tidal:
    timeout: 15s
    concurrency: 8
deadcache:
  ttl: 3h # decouple from subscriptions.interval: a per-cycle TTL would make the dead-node cache a no-op. Set 0s to disable.
fetch:
  # HTTP fetch timeout per subscription; unresponsive sources fail fast
  timeout: 3s
groups:
  nato:
    - "AL"
    - "BE"
    - "BG"
    - "CA"
    - "HR"
    - "CZ"
    - "DK"
    - "EE"
    - "FI"
    - "FR"
    - "DE"
    - "GR"
    - "HU"
    - "IS"
    - "IT"
    - "LV"
    - "LT"
    - "LU"
    - "ME"
    - "NL"
    - "MK"
    - "NO"
    - "PL"
    - "PT"
    - "RO"
    - "SK"
    - "SI"
    - "ES"
    - "SE"
    - "TR"
    - "GB"
    - "US"
  geo_blocked:
    - "RU"
    - "IR"
    - "SY"
    - "KP"
    - "CU"
    - "CN"
    - "BY"
subscriptions:
  interval: 1h
  # Where the last published list is kept so a restart serves it immediately;
  # without it /stable.txt answers 503 for a whole cycle (measured 58 minutes
  # on a 68266-node pool). It sits in the /config mount because that is the
  # only writable directory outliving the container that this service already
  # owns as uid 1000 -- .geoblock.db and .crawler-state.json are its
  # neighbours -- so persistence adds no volume, no host-side provisioning and
  # no new way to fail. Anywhere under /tmp would instead land in the
  # container's own layer, which `docker compose up -d` recreates after a
  # build: it would survive the restarts that never hurt and never the
  # redeploy that caused those 58 minutes. So the file outlives a redeploy AND
  # a host reboot, the same guarantee those two neighbours already have; a
  # restored list keeps its original timestamp, leaving its age visible in
  # X-Stable-Stats updated= instead of reset by the restart. Empty disables.
  # Changing it needs a restart, not a reload.
  snapshot_path: /config/.stable-snapshot.json
  check:
    # URL-test (latency) prober params only; through-node filters live in `filters`.
    rounds: 2
    timeout: 1000ms # per-attempt cap; live nodes near max_avg_ms need headroom, tighter values false-fail them under load
    max_fail: 1
    max_avg_ms: 800
    concurrency: 16 # in-flight URL tests. URLTest measures wall-clock (time.Since incl. dial+crypto+TLS), so probing many at once inflates measured latency and false-fails live nodes (test on 126 nodes: conc<=16 == serial baseline, conc=64 +107ms, conc=256 +166ms). conc=8 tried in prod for a day: no yield gain (avg kept 335 vs 361 at 16 -- 16 is already below the contention knee) but cycles grew 39->51min, eating the sub-1h margin (a reload no longer cancels a cycle, but a cycle longer than the interval still delays every publication). 16 is the sweet spot; do not lower
    source_timeout: 5m
    # test_url: https://www.gstatic.com/generate_204 # default: latency-probe target fetched through each node
    # expected_status: "204" # default: accepted status(es), mihomo IntRanges syntax
