services:
  sub-preprocessor:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub-preprocessor:latest
    container_name: sub-preprocessor
    user: "1000:1000" # config owner: read the 0400 agenix secret + write /config/.geoblock.db
    ports:
      - "7008:8080"
      # internal Prometheus metrics; loopback-only so the host Prometheus can scrape it but it is not public
      - "127.0.0.1:9091:9090"
    volumes:
      - ./config:/config:rw
      # agenix-decrypted secret; the Gemini key is read from it (geoblock.gemini.key_file)
      - /run/agenix/litellm-env:/run/agenix/litellm-env:ro
    # Must exceed internal/app's shutdownTimeout (15s) + controllerStopTimeout
    # (5s) so a graceful stop finishes instead of being SIGKILLed mid-drain.
    stop_grace_period: 30s
    restart: always

  tg-sub-crawler:
    image: sub-preprocessor:latest
    container_name: tg-sub-crawler
    command: ["crawl"]
    user: "0:0"
    depends_on:
      - sub-preprocessor # no build: section here, so that service is what produces the image
    volumes:
      - ./config:/config:rw
    ports:
      # Loopback only: this surface also carries POST /crawl, an unauthenticated
      # trigger. It exists so the crawl counters (stable_crawl_*, both the topic
      # family and the GitHub phase's nine) are scrapable at all — the service's
      # own :9090 renders none of them, and without a scrape the Grafana crawler
      # row reads No data. Scraped under the sub-preprocessor job as a second
      # target (deploy/monitoring.nix).
      - "127.0.0.1:9092:9092"
    environment:
      # Seed channels live in config/channels.yaml (hot-reloaded each cycle).
      # CRAWL_CHANNELS (comma/space list) still works as an extra override.
      - CRAWL_CHANNELS_FILE=/config/channels.yaml
      - CRAWL_PRIVATE=/config/private.yaml
      # - CRAWL_DEAD_TTL=720h # uncomment to override how long a definitive not-live verdict (404/410/451, advertised expiry) keeps a URL out of the discovery pass; 0 disables, default 720h
      # Explicit because the default is invisible when wrong: the mint reads
      # these two for names it must not take, and a broken mount would look
      # exactly like a clean cycle.
      - CRAWL_CURATED=/config/sources.yaml,/config/config.yaml
      - TZ=Europe/Moscow
      # - CRAWL_AT=04:00     # uncomment to run once daily at HH:MM instead of the hourly interval
      - CRAWL_INTERVAL=1h    # hourly poll of t.me/s (cheap; near-real-time enough)
      - CRAWL_PAGES=6
      - CRAWL_PRUNE=1
      - CRAWL_DEPTH=3          # repost-graph recursion depth; higher = wider fan-out + longer cycles
      - CRAWL_MAX_CHANNELS=0   # 0 = built-in per-cycle cap on discovered channels (see defaultMaxDiscovered)
      - CRAWL_STATE=/config/.crawler-state.json
      - CRAWL_STATE_TTL=720h
      # GitHub discovery phase (internal/ghfind + internal/crawl/github.go): a
      # second discovery path in the SAME process and cycle, feeding the same
      # mint. Algorithm, rate limits and the full knob table: docs/guides/github.md.
      # Any GITHUB_* key not set here runs at the default that table states.
      # The token file is operator-provided and gitignored (./config/.github-token);
      # an absent file disables the phase rather than failing the cycle.
      - GITHUB_TOKEN_FILE=/config/.github-token
      # Explicit because the default is invisible when wrong, like CRAWL_STATE:
      # the census must sit on the writable config mount so it survives restarts.
      - GITHUB_CENSUS=/config/.crawler-census.bin
      # Enables the control surface the port above publishes: GET /metrics,
      # GET /healthz, POST /crawl.
      - CRAWL_HTTP=:9092
    restart: unless-stopped
