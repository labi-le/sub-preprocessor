version: 2
project_name: sub-preprocessor

builds:
  - id: default
    main: "./main.go"
    binary: sub-preprocessor
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
    # No mips: internal/geoblock pulls modernc.org/sqlite -> modernc.org/libc,
    # which ships no Go files for any mips target — build constraints exclude
    # every Go file in libc/signal, /stdio, /stdlib, /sys/types and /time, so the
    # build fails rather than degrading. Measured 2026-08-14 by running the
    # release path for the first time: amd64, arm64 and arm all build, every mips
    # variant fails. The matrix had named them since it was written because no
    # tag had ever exercised it.
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "5"
      - "6"
      - "7"
    tags:
      - netgo
      - osusergo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -extldflags '-static'

archives:
  - id: default
    formats: [ binary ]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  name_template: 'v{{ .Version }}'
  make_latest: true
