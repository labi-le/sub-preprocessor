log:
  level: info # hot-reloadable; debug is per-node/DNS/probe verbose
server:
  listen: :8080
  metrics_listen: :9090 # loopback-only on the host (docker-compose publishes 127.0.0.1:9092)
geo:
  # dbip:/registry: omitted -- their built-in defaults are what the annotate
  # chain wants; geo.asn omitted -- unreferenced, so no Cymru resolver is built.
  geofeed:
    refresh_interval: 24h # unset => 24h; an explicit 0 loads once at startup and never refreshes
    sources:
      - url: https://github.com/ipanalytics/GeoFeed-Harvester/releases/latest/download/geofeed.csv.gz
        type: gzip
      - url: https://raw.githubusercontent.com/Simonadascalu/Freedomtech-Geofeed/refs/heads/main/Freedomtech%20solutions%20-%20ALL
        type: raw
resolver:
  timeout: 5s
  cache_ttl: 1h
  cache_negative_ttl: 10m
# These nodes are used while a mobile operator's whitelist is active, so an
# egress-geo gate answers a question nobody asked: nothing here excludes a
# country, and every gate dropped is a round trip saved per survivor.
filters:
  - type: cidr # IP-stage ALLOW-list: a node whose resolved IP is outside every range dies before any probe
    # The repo also publishes ipwhitelist.txt, the pre-CIDR format. Adding it
    # here would be a REGRESSION, not redundancy: measured 2026-08-09 it is the
    # ".1" of every /24 in the CIDR file, so it adds no range (the union merges
    # to the same 15649) and costs 1.76 MB per refresh -- but urls: is a UNION,
    # so with two sources a failed cidrwhitelist.txt no longer empties the set.
    # It becomes 141664 singletons covering 0.39% of the addresses, and nothing
    # catches that at BUILD -- newCIDRStore refuses only an EMPTY set. A
    # background reload would be refused (swapRefusalSize sees failed>0, then
    # the coverage collapse), so the exposure is any cold build -- a restart, or
    # a reload that edits this entry -- while cidrwhitelist.txt is down.
    urls:
      - https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt
    file_type: raw
    refresh_interval: 24h
  - type: country # without it / validates countries= and then ignores it
    provider: geofeed # inert on /stable.txt: no exclude_* here, so the worker's full allow-set early-returns
  - type: bandwidth # drop nodes slower than min_mbps (last GATE: runs on the fewest nodes)
    test_url: "https://speed.cloudflare.com/__down?bytes=2000000" # Cloudflare speed generator; egresses through the node
    min_mbps: 5 # drop nodes below this; 0 = no floor (annotate only). Raise test_url ?bytes= for higher thresholds
    timeout: 20s # per-node download deadline
    concurrency: 4 # parallel downloads; higher shares the host uplink and can under-report fast nodes
annotate:
  - tag: GEO # [GEO:xx], [GEO:??] when every provider misses
    # No cloudflare: it costs one cdn-cgi/trace request through every survivor
    # to place the EXIT address, and the gate here is on the ENTRY address.
    providers: [geofeed, dbip, registry]
deadcache:
  ttl: 3h # decouple from subscriptions.interval: a per-cycle TTL would make the dead-node cache a no-op. Set 0s to disable.
fetch:
  # Governs the worker's per-source download too, not only / -- filterInto nests
  # it inside subscriptions.check.source_timeout. It is gate 2 of the three the
  # 33 ADDED sources were selected under -- gates 2 and 3 governed all 54, gate
  # 1 only the additions: every added source was admitted only after
  # its whole body downloaded inside this budget, best of 3 attempts. Live
  # cycles land 54 of 54 on a good pass; no bad pass has been observed on this
  # list yet, and the one to expect is rostunnel-mega, which answers in ~300ms or hangs, whatever
  # the deadline, so a longer one buys nothing and only delays the cycle.
  timeout: 3s
subscriptions:
  interval: 1h
  snapshot_path: /config/.stable-snapshot.json # this instance's own /config mount (./config-vassago), so no collision with instance 1
  check:
    rounds: 2
    timeout: 5000ms # per-attempt cap; must exceed max_avg_ms or a node at the gate fails on its own budget. It also sets the pre-check's dial budget (halved per attempt), which is why that budget is derived here and not a constant: a hardcoded 500ms was 8x tighter than this instance's max_avg_ms and deleted nodes it is tuned to keep
    max_fail: 1
    # Measured on this host, cold, one variable moved, all three on the SAME
    # 1807-node pool this list carried before curation: 800 -> 10 published,
    # 8000 -> 14, 12000 -> 22. Monotone, as a looser gate must be. The shipped
    # 4000 published 16, which is NOT a fourth point on that ladder -- it is the
    # post-curation 4214-node pool, 2.3x larger, and three cold cycles tonight
    # published 21, 18 and 16 as the list changed under them, so treat any
    # single count as one draw. Do not extrapolate across the
    # two. 4000 is a MARGIN call, not a feasibility one: the shipped pair
    # measured a 923s cycle over 4214 nodes; at rounds x nodes attempts under
    # one semaphore of 32 that inverts to a mean ATTEMPT of 923*32/(2*4214) =
    # 3.50s -- 70% of the cap, not 100%, because the per-attempt context wraps
    # the whole URLTest and a refused dial returns early; only blackholed paths
    # burn the full budget.
    # Rescaling that blackhole fraction to a 15s cap puts 12000 at ~45-47 min:
    # inside the 1h interval, but leaving ~22% headroom for source growth where
    # 4000 leaves ~74%. The gate is this high at all because the probe measures
    # WALL CLOCK through the node: Karing issue 1535 shows a whitelist REALITY
    # node reading 95ms in a client while its URL test took ~5.9s, and 800 was
    # cutting exactly that population. Retune from stable_kept_latency_ms, whose
    # ladder must keep a bound equal to whatever this becomes.
    max_avg_ms: 4000
    # 16 was the knee measured against a 800ms gate, where the +107ms that
    # conc=64 adds is 13% of the budget; at 4000ms it is 2.7%. Wall time is the
    # binding constraint now, and 32 is what makes the cold cycle 923s.
    concurrency: 32
    source_timeout: 5m
