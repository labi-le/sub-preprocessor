# Subscription sources for the vassago instance: the measured subset of
# config/sources.yaml that actually carries nodes inside the Russian
# mobile-internet CIDR whitelist. Sources are NOT shared with instance 1 and
# the Telegram crawler does not write here -- config.Load only merges the
# sources.yaml and private.yaml sitting beside the config.yaml it was given.
#
# Measured 2026-08-09 against cidrwhitelist.txt (30228 lines, 15649 merged
# ranges, sha256 149d27a8...): the 51 configured sources yielded 59558 nodes on
# 19330 distinct servers, of which 5023 nodes on 1469 servers resolve into the
# whitelist. The 37 below are every source with a non-zero count, ordered by it
# -- which is also the dedupe order stable.Merge applies (first source wins a
# duplicate server:port), so the heaviest contributor keeps its label.
#
# EVERY FIGURE ABOVE IS PRE-PROBE, and the gap to what gets published is the
# number to size a deployment on. Two full cycles from these files: merged 1792,
# probed 1792, 9 reached the bandwidth gate, 8 published -- 0.45% of the
# whitelisted pool, against instance 1's ~335-361. The latency gate is not the
# cause: a 5x-relaxed control (timeout 5000ms, max_avg_ms 4000) reached 15
# survivors for 4x the cycle time, so ~99% of whitelisted nodes simply never
# answer a URL test. Measured from ONE vantage point outside the networks this
# whitelist belongs to, so the production number will differ -- but expect a
# two-digit list, not a four-digit one.
#
# Dropped as measured zero: fastnodes-se, rabbitson, genlib, zhuhaiuk, bocchi2b,
# abikus, obwl-wwh, lime, mifa, wepogp-1, wepogp-4, wepogp-5. Dropped as dead:
# wepogp-2 and wepogp-3 both 404. Four of those are expired subscriptions rather
# than geographically wrong ones (mifa, obwl-wwh and lime serve placeholder
# nodes, abikus serves HTML), so they are dead weight for instance 1 too.
#
# The tail is kept deliberately: after the cidr filter a non-whitelisted node
# costs one cached DNS lookup and dies pre-probe. The lookup is the cost that
# is NOT free, and this list already outruns the cache: the 37 sources resolve
# 16551 distinct hosts per cycle measured WITHOUT rostunnel-mega, which alone
# adds 7705, against internal/resolver's 16384-entry ceiling. Nothing expires
# inside a cycle, so each overflow takes the arbitrary-drop path and loses
# 2048 live entries in map order -- a slice of the cycle re-resolves what its
# own head just looked up. That is not new -- instance 1's own 51 sources reach
# 19330 hosts against the same ceiling -- so it is recorded, not fixed here:
# raising the ceiling changes both instances and wants its own measurement.
#
# rostunnel-mega is flaky rather than unlucky: at the shipped 3s fetch.timeout
# it passed 3 of 5 attempts (3001, 3001, 447, 334, 282 ms), and 1 of 4 at 45s.
# A longer budget buys nothing -- it either answers in ~300ms or hangs until the
# deadline, whatever the deadline is. It is kept because ~13% of the whitelisted
# pool rides on it when it does answer; a cycle that misses it is a smaller
# list, not a broken one.
