# Subscription sources for the vassago instance: every source measured to carry
# nodes inside the cidrwhitelist.txt address space, wherever it came from. 21
# are what survives of the config/sources.yaml subset this file started as; the
# other 33 were found by search and exist only here. Sources are NOT shared
# with instance 1 and the Telegram crawler does not write here -- config.Load
# only merges the sources.yaml and private.yaml sitting beside the config.yaml
# it was given.
#
# That address space is not a Russian ACL, whatever the upstream repo's framing
# suggests -- it is a worldwide 0.0.0.0/0 scan artifact. AS749 DNIC (US DoD) is
# 20.97% of the covered addresses and unrouted AS0 a further 6.52%; by country
# it is 28.32% US against 10.60% RU. "Whitelisted" below means membership in
# that set and asserts nothing about where a node sits.
#
# Curated 2026-08-10 against cidrwhitelist.txt (30228 lines, 15649 merged
# ranges, 36265984 addresses, sha256 149d27a8...), superseding the 51-source
# measurement this header used to record. 16 sources were removed and 33 added;
# 21 of the previous 37 remain. The 16 were redundant in all six audit samples
# taken over 1.5h -- they do carry whitelisted nodes, but every one of those
# nodes arrives on another configured source too -- so dropping them frees
# 5412 node lines per cycle and costs no server:port.
#
# Every added source had to pass three gates:
#   1. FRESH -- its repository shows a push within the last 7 days, read from
#      the commits atom feed. A whitelist subscription that stopped updating is
#      a list of nodes that stopped existing. The feed is the hole in this
#      gate, and it bit twice. Two candidates on storage.yandexcloud.net
#      publish no feed and passed untouched at 94 and 122 days stale, caught by
#      hand on Last-Modified. Then three ACCEPTED sources turned out to sit on
#      the same kind of host with the by-hand check never applied -- gv-cid-white
#      104 days, gist-pidarasuebisov-afk 69, gv-wl 52, all far past the 7-day
#      gate and the first past even the 94-day reject. Removed rather than
#      waived: a gate that admits what it
#      rejects elsewhere is not a gate. Query the branch tip by hand for every
#      no-feed candidate. Of the 54 shipped entries 52 are GitHub-hosted and
#      were re-checked by feed; every ADDED one is 0-5.4 days old. The other
#      two are survivors and no-feed: bywarm-merged on gitverse, fresh by its
#      branch API, and rostunnel-mega on vercel, whose freshness no signal
#      this gate names can obtain -- it sends no Last-Modified at all.
#      Gate 1 never applied to the 21 survivors, and two of them are stale by
#      it: whitelist-sanuyyq at 132 days, worse than the 104-day source removed
#      above, and obhodwl at 90, which is inside that bar but far outside the
#      7-day gate. They stay because a survivor was
#      condemned or kept on gate 3, not on freshness -- but do not read this
#      list as uniformly fresh, and audit them the next time gate 3 runs.
#   2. FETCHABLE -- the full body downloads inside the shipped fetch.timeout of
#      3s, best of 3 attempts, AND comes in under the worker's 10 MiB body cap
#      -- internal/subscription's maxSubscriptionSize (subscription.go:13),
#      reached through the one subscription.Load call and therefore SHARED
#      with instance 1; internal/fetch takes the limit as a parameter and
#      holds no cap of its own, and classify.go:20 keeps a synced copy, so
#      raising it is a three-file edit. The cap is the gate a script forgets,
#      because a candidate that violates it fetches fine outside the pipeline
#      and then fails every cycle: gitverse.ru/LimonTH/proxy-list output/live
#      -- forge-native, and 404 on GitHub, which is why no keyword search finds
#      it -- measured +445
#      new and downloads in 1.4s, but at 10.4 MiB the worker logs "response too
#      large" and loads NOTHING. Its sibling output/raw fails the other half at
#      30.0 MiB and 4.7-5.0s. Both rejected; no accepted source exceeds 7 MiB.
#      Best of 3 rather than one shot because the failure mode here is bimodal,
#      not slow -- see rostunnel-mega below.
#   3. MARGINAL -- it contributes whitelisted server:port that no
#      already-accepted source carries, and the whole added block fits a budget
#      of 30000 resolved hosts per cycle. A source that only re-carries an
#      accepted source's nodes was rejected however large it is.
#
# Result: 1709 -> 4006 distinct whitelisted server:port, measured directly on
# the shipped list rather than derived. Neither that nor the +2368 union the
# additions showed at pick time is the sum of the individual gains. Those
# gains sum to 2247, and that sum is a lower bound and nothing else: each was
# measured greedily against the coverage of the sources accepted before it, so
# it can neither be added up nor subtracted from when the set changes. Measure
# the union again after touching this list -- every attempt today to shortcut
# that with a sum got a different, wrong number.
#
# EVERY FIGURE HERE IS PRE-PROBE, and the gap to what gets published is the
# number to size a deployment on. Measured on the shipped pair of files, cold
# cache, on the deployment host: merged 4214, probed 4214, published 16, in a
# 923-second cycle. Three earlier points on the same gates, all on the one
# 1807-node pool this list carried before curation: max_avg_ms 800 published
# 10, 8000 published 14, 12000 published 22. Expect a two-digit list out
# of a four-digit pool, and expect production to differ -- every figure here
# was measured from ONE vantage point outside the networks the whitelist's
# addresses belong to.
#
# The cost of all this is DNS, which is why gate 3 carries a host budget and
# not just a contribution test. After the CIDR filter a non-whitelisted node
# costs one cached DNS lookup and dies pre-probe, so the bill is distinct
# hosts, not nodes, and the tail of a source is never free. Measured as a
# UNION, because per-source host counts cannot be added -- the same host
# appears in many lists, and what collapses the repeats is pctx.Resolved
# within one source plus internal/resolver's global cache across them, both
# BEFORE stable.Merge, which keys on server:port and never sees a host: all 54
# sources resolve 31313 distinct hosts per cycle where their per-source counts
# sum to 64324, so 51.3% of what they list is a cross-source duplicate. The 21
# survivors alone resolve 18516, putting the marginal cost of the 33 added at
# +12797 -- against the 28244 their own counts sum to, a discount of more than
# half. 31313 is 1.9x internal/resolver's 16384-entry ceiling, so the
# cache is overwritten roughly twice per cycle and eviction picks by Go map
# order, which carries no recency: a cross-source duplicate that used to hit
# now misses. The eviction itself is cheap and does NOT thrash -- dropping
# 2048 entries amortises the expiry scan to ~8 steps per insert, single-digit
# milliseconds per cycle. The cost is the miss, because a miss is a serial DNS
# round trip on the per-source path. Note the cycle now outlives
# resolver.cache_negative_ttl (10m against a measured 923s), so a dead host
# cached early expires before the cycle ends and is looked up AGAIN inside it;
# that also means the expiry scan frees real entries, and the arbitrary-drop
# branch fires less often than every overflow. Recorded, not fixed here: the
# ceiling is shared with instance 1, whose own sources reach 19330 hosts
# against it, so raising it changes both and wants its own measurement.
#
# Order is the dedupe order stable.Merge applies -- first source wins a
# duplicate server:port, keeping its label on it. The surviving originals lead
# because they are the measured heavy contributors; the added block follows in
# descending marginal contribution.
#
# aetris, bijandi, flat447 and prominbro look like removal candidates and are
# deliberately not removed. Across those same six samples each was redundant in
# some and unique in others. These lists rotate hourly, so one sample finding a
# source's nodes elsewhere is not evidence that it never carries its own; it
# takes a run of samples, which is what condemned the 16.
#
# The 16, named because they are the expensive category to re-derive: avia,
# bahemmat, darmioniks, igareck-white, mehrtat, mhditaheri, ninjanexus, purple,
# reality, rostunnel-gen, shatak, theavel, vova, wind7077, yuanxiawan and
# zxcursed. None is dead and none is a zero -- each carries whitelisted nodes,
# so all sixteen clear gate 2 and were condemned on gate 3 alone. That
# says nothing about gate 1: freshness was never measured for them, and for
# reality (gitflic), purple (hub.mos.ru) and rostunnel-gen (vercel) no signal
# the gate names can obtain it at all. Re-adding one costs another run of
# samples to condemn it again AND a gate-1 check it has never had.
#
# kreemchek-26 is a fork of the same githubmirror/26.txt that goida already
# serves from AvenCores, and it sits behind goida in the order, so its measured
# +210 is by construction that fork's divergence from the copy already
# configured. Kept on the measurement, but expect it to decay: a fork earns its
# place only while it keeps diverging.
#
# rostunnel-mega is flaky rather than unlucky: at the shipped 3s fetch.timeout
# it passed 3 of 5 attempts (3001, 3001, 447, 334, 282 ms), and 1 of 4 at 45s.
# A longer budget buys nothing -- it either answers in ~300ms or hangs until
# the deadline, whatever the deadline is. It is kept because ~13% of the old
# 1709 pool rode on it when it did answer; a cycle that misses it is a smaller
# list, not a broken one.
#
# Do not re-add: wepogp-2 and wepogp-3 are both 404, and fastnodes-se,
# rabbitson, genlib, zhuhaiuk, bocchi2b, abikus, obwl-wwh, lime, mifa, wepogp-1,
# wepogp-4 and wepogp-5 measured zero whitelisted nodes. Four of those are
# expired rather than geographically wrong -- mifa, obwl-wwh and lime serve
# placeholder nodes, abikus serves HTML -- so they are dead weight for
# instance 1 too.
